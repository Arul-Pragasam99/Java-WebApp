<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="app">

    <header class="topbar">
        <h1>Task Manager</h1>
    </header>

    <section class="stats">
        <div class="stat">
            <h2 th:text="${totalCount}">0</h2>
            <p>Total</p>
        </div>
        <div class="stat">
            <h2 th:text="${pendingCount}">0</h2>
            <p>Pending</p>
        </div>
        <div class="stat">
            <h2 th:text="${completedCount}">0</h2>
            <p>Completed</p>
        </div>
    </section>

    <section class="main-grid">

        <div class="card add-box">
            <h2>Add Task</h2>

            <form th:action="@{/tasks}" th:object="${newTask}" method="post">
                <input type="text" th:field="*{title}" placeholder="Task title" required/>
                <textarea th:field="*{description}" placeholder="Description..."></textarea>
                <select th:field="*{priority}">
                    <option value="LOW">Low Priority</option>
                    <option value="MEDIUM">Medium Priority</option>
                    <option value="HIGH">High Priority</option>
                </select>
                <button class="btn primary">Add Task</button>
            </form>
        </div>

        <div class="task-area">

            <div class="task-header">
                <h2>Your Tasks</h2>
                <span th:text="${tasks.size()} + ' total'"></span>
            </div>

            <div class="task-grid">

                <div class="task-card"
                     th:each="task : ${tasks}"
                     th:classappend="${task.completed} ? 'completed' : ''">

                    <div class="task-top">
                        <h3 th:text="${task.title}">Task</h3>
                        <span class="priority"
                              th:text="${task.priority}"
                              th:classappend="
                                ${task.priority.name() == 'HIGH'} ? 'high' :
                                (${task.priority.name() == 'LOW'} ? 'low' : 'medium')">
                        </span>
                    </div>

                    <p th:if="${task.description}" th:text="${task.description}"></p>

                    <div class="task-actions">
                        <form th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post">
                            <button class="btn small"
                                    th:text="${task.completed} ? 'Undo' : 'Done'">
                            </button>
                        </form>

                        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn small edit">Edit</a>

                        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
                            <button class="btn small danger">Delete</button>
                        </form>
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>

</body>
</html>
